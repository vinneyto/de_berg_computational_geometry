[project]
name = "de-berg-computational-geometry"
version = "0.1.0"
description = "A test-driven Python course on line segment intersection, DCEL, and map overlay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.1.1",
    "sortedcontainers>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.8",
]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tasks", "tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de_berg_geometry"]
